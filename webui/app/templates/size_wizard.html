<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <!--
    ============================================================
    Size Wizard – HandBrake TSD Helper
    ------------------------------------------------------------
    - Text preview is fast (no encode)
    - Image preview is expensive (HandBrake short encode + ffmpeg)
      So we:
        • DO NOT run it automatically on page load
        • Add timeout + error handling
        • Provide a button to request it explicitly
    ============================================================
  -->

  <title>HandBrake TSD Helper – Size Wizard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styleui.css') }}">

  <style>
    .compare-wrap{
      position: relative;
      width: 100%;
      max-width: 960px;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.25);
      aspect-ratio: 16 / 9; /* stable height before images load */
      user-select: none;
    }

    /* Both images must fill the box identically */
    .compare-img{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* NEW = bottom layer (full image) */
    #imgNew { z-index: 1; }

    /* OLD = top layer that we "wipe away" from bottom */
    #imgOld {
      z-index: 2;
      /* clip-path is updated live in JS */
      clip-path: inset(0 0 50% 0);
    }

    /* White draggable bar */
    .wipe-handle{
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 100%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
      z-index: 3;
      cursor: ew-resize;
    }

    /* Center “grip” */
    .wipe-handle::after{
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 18px;
      height: 42px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(4px);
    }

    .compare-label{
      position: absolute;
      top: 10px;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      pointer-events: none;
      z-index: 4;
    }
    .label-old { left: 10px; }
    .label-new { right: 10px; }

    .img-status{
      margin-top: 8px;
      max-width: 960px;
      white-space: pre-wrap;
    }

    .btn-row{
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <nav class="top-nav">
    <a href="/" class="nav-link">Jobs</a>
    <a href="/size_wizard" class="nav-link nav-link-active">Size Wizard</a>
    <a href="/settings" class="nav-link">Settings</a>
  </nav>

  <h1>Size Wizard</h1>

  <div class="section-card">
    <h2>Pick size + quality, then queue the job</h2>

    <div class="row">
      <label>Selected file:</label>
      <input id="src" type="text" style="width:80%;" readonly>
    </div>

    <div class="row">
      <label for="preset">Preset base:</label>
      <select id="preset">
        <option value="auto">Auto by filename</option>
        <option value="1080">Force 1080p preset</option>
        <option value="4k">Force 4K preset</option>
      </select>
    </div>

    <div class="row">
      <label>Target size:</label>
      <input id="sizeValue" type="number" min="1" step="0.1" value="5" style="width:120px;">
      <select id="sizeUnit">
        <option value="GB" selected>GB</option>
        <option value="MB">MB</option>
      </select>
    </div>

    <div class="row">
      <label for="quality">Quality priority:</label>
      <select id="quality">
        <option value="high">High quality (slower)</option>
        <option value="balanced" selected>Balanced</option>
        <option value="small">Smallest possible (faster)</option>
      </select>
    </div>

    <div class="row">
      <label style="min-width:160px;">Resolution behavior:</label>
      <label style="margin-right:16px;">
        <input id="allowDownscale" type="checkbox" checked>
        Allow downscale if needed
      </label>
      <label>
        <input id="force4k" type="checkbox">
        Force keep original resolution
      </label>
    </div>

    <div class="row">
      <button id="queueBtn">Queue Wizard Encode</button>
      <span id="queueStatus" class="small"></span>
    </div>

    <hr>

    <h3>Live Preview</h3>
    <div id="previewBox" class="small" style="white-space: pre-wrap;"></div>

    <hr>

    <h3>Visual Compare</h3>
    <p class="small">
      OLD is on top. NEW is underneath.
      Drag the white bar: right → reveal more NEW, left → show more OLD.
    </p>

    <div class="btn-row">
      <button id="genImagesBtn">Generate Visual Compare</button>
      <span class="small" style="opacity:0.85;">(this runs a short encode + ffmpeg extract)</span>
    </div>

    <div id="compareWrap" class="compare-wrap" style="display:none;">
      <!-- NEW underneath -->
      <img id="imgNew" class="compare-img" alt="Wizard frame (NEW)">
      <!-- OLD on top (we clip it) -->
      <img id="imgOld" class="compare-img" alt="Original frame (OLD)">

      <div id="handle" class="wipe-handle" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>

      <div class="compare-label label-old">OLD</div>
      <div class="compare-label label-new">NEW</div>
    </div>

    <div id="imgStatus" class="small img-status"></div>
  </div>

  <script>
    // -----------------------------
    // Helpers
    // -----------------------------
    async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
      const timeoutController = new AbortController();
      const timeoutId = setTimeout(() => timeoutController.abort(), timeoutMs);

      // If caller provided a signal, combine it with the timeout signal
      let signal = timeoutController.signal;

      if (options.signal) {
        if (typeof AbortSignal !== "undefined" && AbortSignal.any) {
          signal = AbortSignal.any([timeoutController.signal, options.signal]);
        } else {
          // Fallback for browsers without AbortSignal.any:
          // If caller aborts, also abort our timeout controller
          try {
            options.signal.addEventListener("abort", () => timeoutController.abort(), { once: true });
          } catch (e) {}
          signal = timeoutController.signal;
        }
      }

      try {
        // IMPORTANT: spread options, but override signal with our combined signal
        return await fetch(url, { ...options, signal });
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function fmtSeconds(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    // -----------------------------
    // Prefill from query string
    // -----------------------------
    const srcQ = qs("src");
    const presetQ = qs("preset");
    if (srcQ) document.getElementById("src").value = srcQ;
    if (presetQ) document.getElementById("preset").value = presetQ;

    let previewTimer = null;

    // -----------------------------
    // NEW: preview session id + cancel support
    // -----------------------------
    const PREVIEW_ID_KEY = "hbwiz_preview_id";

    function newPreviewId() {
      // stable enough, no deps
      return (Date.now().toString(16) + Math.random().toString(16).slice(2));
    }

    // One preview_id per Size Wizard visit/session
    let previewId = sessionStorage.getItem(PREVIEW_ID_KEY);
    if (!previewId) {
      previewId = newPreviewId();
      sessionStorage.setItem(PREVIEW_ID_KEY, previewId);
    }

    // Track an in-flight image request so we can abort it on navigation
    let imgFetchController = null;

    function cancelPreviewOnServer() {
      // cancel in-flight fetch (client side)
      try { imgFetchController?.abort(); } catch (e) {}
      imgFetchController = null;

      // tell server to kill HandBrake preview for this preview_id
      // use sendBeacon so it still fires during unload/navigation
      const payload = JSON.stringify({ preview_id: previewId });

      if (navigator.sendBeacon) {
        const blob = new Blob([payload], { type: "application/json" });
        navigator.sendBeacon("/wizard_preview_cancel", blob);
        return;
      }

      // fallback if sendBeacon not available
      fetch("/wizard_preview_cancel", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }

    // Fire cancel when leaving Size Wizard
    window.addEventListener("pagehide", cancelPreviewOnServer);
    window.addEventListener("beforeunload", cancelPreviewOnServer);

    function currentPayload() {
      return {
        src: document.getElementById("src").value,
        preset: document.getElementById("preset").value,
        target_size_value: Number(document.getElementById("sizeValue").value),
        target_size_unit: document.getElementById("sizeUnit").value,
        quality: document.getElementById("quality").value,
        allow_downscale: document.getElementById("allowDownscale").checked,
        force_4k: document.getElementById("force4k").checked
      };
    }

    // -----------------------------
    // Text preview
    // -----------------------------
    async function refreshPreviewText() {
      const payload = currentPayload();
      const box = document.getElementById("previewBox");

      if (!payload.src) {
        box.textContent = "No file selected.";
        return;
      }

      box.textContent = "Calculating preview…";

      let res, data;
      try {
        res = await fetchWithTimeout("/wizard_preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }, 15000);
        data = await res.json();
      } catch (e) {
        box.textContent = "Preview error: server unreachable or timed out.";
        return;
      }

      if (!res.ok) {
        box.textContent = JSON.stringify(data, null, 2);
        return;
      }

      const p = data.probe || {};
      const e = data.estimates || {};

      box.textContent =
        `Source: ${payload.src}\n` +
        `Duration: ${fmtSeconds(p.duration_sec)} | ${p.width}x${p.height} @ ${Number(p.fps || 0).toFixed(2)} fps\n\n` +
        `Target size: ${Number(data.inputs?.target_mb || 0).toFixed(0)} MB\n` +
        `Bitrate: video ${e.video_bitrate_kbps} kbps / audio ${e.audio_bitrate_kbps} kbps\n` +
        `Quality: ${e.quality_label} (bpp=${e.bpp})\n\n` +
        `CPU: ${e.cpu_label} (x${e.cpu_speed_index})\n` +
        `ETA: ${e.eta_human} (~${e.est_fps} fps)\n\n` +
        `Output: ${e.output_resolution?.width}x${e.output_resolution?.height} (${e.decision})`;
    }

    function schedulePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(refreshPreviewText, 350);
    }

    // -----------------------------
    // Visual compare (bar drag)
    // -----------------------------
    const wrap = document.getElementById("compareWrap");
    const imgOld = document.getElementById("imgOld");
    const imgNew = document.getElementById("imgNew");
    const handle = document.getElementById("handle");

    let isDragging = false;
    let pos01 = 0.5; // 0..1

    function applyWipe(p01) {
      pos01 = Math.max(0, Math.min(1, p01));
      const revealPct = pos01 * 100;
      imgOld.style.clipPath = `inset(0 0 ${revealPct}% 0)`;
      handle.style.left = `${revealPct}%`;
      handle.setAttribute("aria-valuenow", String(Math.round(revealPct)));
    }

    function pointerToPos01(ev) {
      const r = wrap.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width;
      return x;
    }

    function startDrag(ev) {
      if (wrap.style.display === "none") return;
      isDragging = true;
      wrap.setPointerCapture?.(ev.pointerId);
      applyWipe(pointerToPos01(ev));
    }

    function moveDrag(ev) {
      if (!isDragging) return;
      applyWipe(pointerToPos01(ev));
    }

    function endDrag(ev) {
      isDragging = false;
      try { wrap.releasePointerCapture?.(ev.pointerId); } catch(e) {}
    }

    wrap.addEventListener("pointerdown", startDrag);
    wrap.addEventListener("pointermove", moveDrag);
    window.addEventListener("pointerup", endDrag);

    handle.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { e.preventDefault(); applyWipe(pos01 - 0.03); }
      if (e.key === "ArrowRight"){ e.preventDefault(); applyWipe(pos01 + 0.03); }
    });

    // -----------------------------
    // Image preview (expensive)
    // -----------------------------
    async function refreshPreviewImages() {
      const payload = currentPayload();
      const status = document.getElementById("imgStatus");
      const btn = document.getElementById("genImagesBtn");

      if (!payload.src) {
        status.textContent = "Pick a file first (go back to Jobs).";
        return;
      }

      // If a request is already running, treat button click as "Cancel"
      if (btn.dataset.busy === "1") {
        status.textContent = "Canceling preview…";
        cancelPreviewOnServer();
        btn.dataset.busy = "0";
        btn.textContent = "Generate Visual Compare";
        btn.disabled = false;
        wrap.style.display = "none";
        return;
      }

      // UI -> busy
      btn.dataset.busy = "1";
      btn.textContent = "Cancel Preview";
      btn.disabled = false;

      status.textContent = "Generating image preview (short encode)…";

      // include preview_id so server can kill the right HandBrake run
      payload.preview_id = previewId;

      // cancel any previous server preview before starting a new one
      cancelPreviewOnServer();

      // NEW: use our own abort controller so leaving page stops the wait
      imgFetchController = new AbortController();

      let res, data;
      try {
        // IMPORTANT: timeout so it doesn't hang forever
        // (backend uses timeout=90s, so we pick 95s)
        res = await fetchWithTimeout("/wizard_preview_images", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: imgFetchController.signal
        }, 195000);

        data = await res.json();
      } catch (e) {
        status.textContent = "Image preview canceled / unreachable / timed out.";
        wrap.style.display = "none";
        return;
      } finally {
        imgFetchController = null;
        // UI -> not busy
        btn.dataset.busy = "0";
        btn.textContent = "Generate Visual Compare";
        btn.disabled = false;
      }

      if (!res.ok) {
        const msg = (data && data.error) ? String(data.error) : "";
        if (msg.toLowerCase().includes("ffmpeg not found")) {
          status.textContent = "Image preview needs ffmpeg inside the container. Install ffmpeg in the Dockerfile.";
        } else if (msg.toLowerCase().includes("timed out")) {
          status.textContent = "Image preview timed out. Try again, or pick a shorter / easier file.";
        } else {
          status.textContent = "Image preview error:\n" + JSON.stringify(data, null, 2);
        }
        wrap.style.display = "none";
        return;
      }

      // Keep layout stable
      imgOld.onload = () => {
        if (imgOld.naturalWidth && imgOld.naturalHeight) {
          wrap.style.aspectRatio = `${imgOld.naturalWidth} / ${imgOld.naturalHeight}`;
        }
      };

      imgNew.src = "data:image/jpeg;base64," + data.new_b64;
      imgOld.src = "data:image/jpeg;base64," + data.old_b64;

      wrap.style.display = "";
      applyWipe(0.5);

      status.textContent = `Frame at ~${fmtSeconds(data.when_seconds)} (drag the white bar)`;
    }

    // -----------------------------
    // Queue
    // -----------------------------
    async function queueWizard() {
      const payload = currentPayload();
      if (!payload.src) return alert("No file selected.");

      const statusEl = document.getElementById("queueStatus");
      statusEl.textContent = "Queuing…";

      let res;
      try {
        res = await fetchWithTimeout("/encode_wizard", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }, 15000);
      } catch (e) {
        statusEl.textContent = "Error";
        alert("Queue failed: server unreachable or timed out.");
        return;
      }

      if (!res.ok) {
        statusEl.textContent = "Error";
        alert(await res.text());
        return;
      }

      statusEl.textContent = "Queued!";
      setTimeout(() => statusEl.textContent = "", 2500);
    }

    // -----------------------------
    // Events
    // -----------------------------
    ["preset","sizeValue","sizeUnit","quality","allowDownscale","force4k"].forEach(id => {
      document.getElementById(id).addEventListener("change", schedulePreview);
      document.getElementById(id).addEventListener("input", schedulePreview);
    });

    document.getElementById("queueBtn").onclick = queueWizard;
    document.getElementById("genImagesBtn").onclick = refreshPreviewImages;

    // Initial: ONLY text preview
    schedulePreview();
  </script>

</body>
</html>
