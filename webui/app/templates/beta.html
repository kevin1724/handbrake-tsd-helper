<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HandBrake TSD Helper - Beta</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styleui.css') }}">
  <style>
    .beta-shell {
      max-width: none;
      margin: 0;
    }

    .beta-toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) repeat(3, minmax(120px, auto));
      gap: 10px;
      align-items: end;
    }

    .beta-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .beta-field label,
    .beta-label {
      font-size: 12px;
      color: rgba(229,229,229,0.7);
    }

    .beta-field select,
    .beta-field input[type="search"],
    .beta-field input[type="number"] {
      width: 100%;
      min-height: 34px;
    }

    .beta-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      white-space: nowrap;
      color: rgba(229,229,229,0.82);
    }

    .beta-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .beta-stat {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px;
      background: rgba(255,255,255,0.035);
    }

    .beta-stat span {
      display: block;
      font-size: 12px;
      color: rgba(229,229,229,0.62);
    }

    .beta-stat strong {
      display: block;
      margin-top: 3px;
      font-size: 20px;
      color: #fff;
    }

    .beta-bulkbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      background: rgba(0,0,0,0.14);
    }

    .beta-bulkbar select {
      min-height: 32px;
    }

    .beta-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
      margin-top: 14px;
    }

    .beta-column {
      min-width: 0;
    }

    .beta-column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .beta-column-header h2 {
      margin: 0;
    }

    .beta-count {
      color: rgba(229,229,229,0.66);
      font-size: 12px;
    }

    .beta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
      gap: 10px;
      max-height: calc(100vh - 330px);
      min-height: 320px;
      overflow: auto;
      padding-right: 4px;
    }

    .beta-card {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(255,255,255,0.035);
      overflow: hidden;
      min-width: 0;
    }

    .beta-card-selected {
      outline: 2px solid rgba(0,188,212,0.78);
      outline-offset: -2px;
    }

    .beta-poster {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: linear-gradient(145deg, #20252c, #3d4a45);
      overflow: hidden;
    }

    .beta-poster img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .beta-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-weight: 700;
      font-size: 22px;
      line-height: 1.1;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
        #27303a;
    }

    .beta-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(0,0,0,0.62);
      color: #fff;
    }

    .beta-card-body {
      padding: 9px;
    }

    .beta-card-title {
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .beta-card-meta {
      margin-top: 6px;
      display: grid;
      gap: 3px;
      color: rgba(229,229,229,0.68);
      font-size: 12px;
    }

    .beta-select-line {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
      color: rgba(229,229,229,0.82);
      font-size: 12px;
    }

    .beta-card-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .beta-card-actions button {
      flex: 1;
      min-width: 0;
    }

    .beta-empty {
      color: rgba(229,229,229,0.66);
      border: 1px dashed rgba(255,255,255,0.16);
      border-radius: 8px;
      padding: 18px;
      min-height: 120px;
    }

    .beta-attribution {
      margin-top: 10px;
      color: rgba(229,229,229,0.58);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .beta-toolbar,
      .beta-layout,
      .beta-stats {
        grid-template-columns: 1fr;
      }

      .beta-grid {
        max-height: none;
      }

      .beta-bulkbar {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="beta-page">
  <nav class="top-nav">
    <a href="/" class="nav-link">Jobs</a>
    <a href="/size_wizard" class="nav-link">Size Wizard</a>
    <a href="/beta" class="nav-link nav-link-active">Beta</a>
    <a href="/settings" class="nav-link">Settings</a>
  </nav>

  <main class="beta-shell">
    <h1>Beta</h1>

    <section class="section-card">
      <div class="beta-toolbar">
        <div class="beta-field">
          <label for="rootSelect">Library scope</label>
          <select id="rootSelect"></select>
        </div>

        <div class="beta-field">
          <label for="limitInput">Scan limit</label>
          <input id="limitInput" type="number" min="1" max="2000" step="50" value="800">
        </div>

        <label class="beta-toggle">
          <input id="posterToggle" type="checkbox" checked>
          Posters
        </label>

        <button id="scanBtn" type="button">Refresh Scan</button>
      </div>

      <div class="beta-toolbar" style="margin-top:10px;">
        <div class="beta-field">
          <label for="searchInput">Filter</label>
          <input id="searchInput" type="search" placeholder="Title, year, filename">
        </div>

        <label class="beta-toggle">
          <input id="recursiveToggle" type="checkbox" checked>
          Recursive
        </label>

        <span id="betaStatus" class="small"></span>
      </div>

      <div class="beta-bulkbar">
        <label class="beta-toggle" for="queuePresetSelect">
          Queue preset
          <select id="queuePresetSelect">
            <option value="auto" selected>Auto</option>
            <option value="1080">1080p</option>
            <option value="4k">4K</option>
          </select>
        </label>
        <button id="queueSelectedBtn" type="button" disabled>Queue selected</button>
        <button id="clearSelectedBtn" type="button">Clear selection</button>
        <span id="selectedCount" class="small">0 selected</span>
      </div>

      <div class="beta-stats">
        <div class="beta-stat"><span>Movies</span><strong id="statMovies">0</strong></div>
        <div class="beta-stat"><span>Shows</span><strong id="statShows">0</strong></div>
        <div class="beta-stat"><span>Episodes</span><strong id="statEpisodes">0</strong></div>
        <div class="beta-stat"><span>Scanned</span><strong id="statScanned">0</strong></div>
      </div>

      <div id="tmdbNotice" class="beta-attribution"></div>
    </section>

    <section class="beta-layout">
      <div class="beta-column">
        <div class="beta-column-header">
          <h2>Movies</h2>
          <span id="movieCount" class="beta-count">0</span>
        </div>
        <div id="moviesGrid" class="beta-grid"></div>
      </div>

      <div class="beta-column">
        <div class="beta-column-header">
          <h2>Shows</h2>
          <span id="showCount" class="beta-count">0</span>
        </div>
        <div id="showsGrid" class="beta-grid"></div>
      </div>
    </section>
  </main>

  <script>
    const roots = {{ roots|tojson }};
    const tmdbConfigured = {{ tmdb_configured|tojson }};
    let libraryData = { movies: [], shows: [], stats: {} };
    const selectedPaths = new Set();

    function el(id) {
      return document.getElementById(id);
    }

    function fmtBytes(bytes) {
      const value = Number(bytes || 0);
      if (!Number.isFinite(value) || value <= 0) return "-";
      const gb = value / (1024 ** 3);
      if (gb >= 1) return `${gb.toFixed(gb >= 10 ? 1 : 2)} GB`;
      const mb = value / (1024 ** 2);
      if (mb >= 1) return `${mb.toFixed(mb >= 10 ? 1 : 2)} MB`;
      const kb = value / 1024;
      if (kb >= 1) return `${kb.toFixed(1)} KB`;
      return `${Math.round(value)} B`;
    }

    function fmtDuration(seconds) {
      const total = Number(seconds || 0);
      if (!Number.isFinite(total) || total <= 0) return "";
      const h = Math.floor(total / 3600);
      const m = Math.round((total % 3600) / 60);
      if (h > 0) return `${h}h ${m}m`;
      return `${Math.max(1, m)}m`;
    }

    function fmtDateTime(ts) {
      const n = Number(ts || 0);
      if (!Number.isFinite(n) || n <= 0) return "";
      const d = new Date(n * 1000);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleString();
    }

    function initials(title) {
      return String(title || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 3)
        .map((part) => part[0]?.toUpperCase() || "")
        .join("") || "?";
    }

    function includesFilter(item, needle) {
      if (!needle) return true;
      const blob = [
        item.title,
        item.year,
        item.filename,
        item.path,
        item.tmdb_title
      ].join(" ").toLowerCase();
      return blob.includes(needle);
    }

    function appendMetaLine(meta, text) {
      const span = document.createElement("span");
      span.textContent = text;
      meta.appendChild(span);
    }

    function itemPaths(item) {
      if (!item) return [];
      if (Array.isArray(item.files)) {
        return item.files.map((file) => file.path).filter(Boolean);
      }
      return item.path ? [item.path] : [];
    }

    function selectionCount() {
      return selectedPaths.size;
    }

    function itemIsSelected(item) {
      const paths = itemPaths(item);
      return paths.length > 0 && paths.every((path) => selectedPaths.has(path));
    }

    function setItemSelected(item, checked) {
      itemPaths(item).forEach((path) => {
        if (checked) selectedPaths.add(path);
        else selectedPaths.delete(path);
      });
      updateSelectionUi();
      renderLibrary();
    }

    function clearSelection() {
      selectedPaths.clear();
      updateSelectionUi();
      renderLibrary();
    }

    function updateSelectionUi() {
      const count = selectionCount();
      el("selectedCount").textContent = `${count} selected`;
      el("queueSelectedBtn").disabled = count === 0;
    }

    function predictionText(prediction) {
      if (!prediction || !prediction.available) return "Prediction: learning from job history";
      const parts = [
        `${fmtBytes(prediction.estimated_out_bytes)} predicted`,
        `${fmtBytes(prediction.estimated_saved_bytes)} saved`
      ];
      const runtime = fmtDuration(prediction.estimated_runtime_seconds);
      if (runtime) parts.push(runtime);
      const samples = Number(prediction.sample_count || 0);
      const confidence = prediction.confidence || "low";
      return `${parts.join(" / ")} (${samples} sample${samples === 1 ? "" : "s"}, ${confidence})`;
    }

    function addSelectLine(body, item, label) {
      const wrap = document.createElement("label");
      wrap.className = "beta-select-line";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = itemIsSelected(item);
      checkbox.addEventListener("change", () => setItemSelected(item, checkbox.checked));
      wrap.appendChild(checkbox);
      wrap.appendChild(document.createTextNode(label));
      body.appendChild(wrap);
    }

    async function queuePaths(paths, label = "selection") {
      const cleanPaths = Array.from(new Set((paths || []).filter(Boolean)));
      if (!cleanPaths.length) {
        el("betaStatus").textContent = "Nothing selected to queue.";
        return;
      }
      const preset = el("queuePresetSelect").value || "auto";
      el("betaStatus").textContent = `Queuing ${label}...`;
      el("queueSelectedBtn").disabled = true;
      try {
        const res = await fetch("/api/beta/queue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paths: cleanPaths, preset })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Queue failed");
        const skipped = Array.isArray(data.skipped) ? data.skipped.length : 0;
        el("betaStatus").textContent = `Queued ${data.count || 0} file${data.count === 1 ? "" : "s"}${skipped ? `, skipped ${skipped}` : ""}.`;
        cleanPaths.forEach((path) => selectedPaths.delete(path));
        updateSelectionUi();
        renderLibrary();
      } catch (e) {
        el("betaStatus").textContent = e.message || "Queue failed";
      } finally {
        updateSelectionUi();
      }
    }

    function queueSelected() {
      queuePaths(Array.from(selectedPaths), "selected files");
    }

    function cardPoster(item, label) {
      const poster = document.createElement("div");
      poster.className = "beta-poster";

      if (item.poster_url) {
        const img = document.createElement("img");
        img.src = item.poster_url;
        img.alt = `${item.title} poster`;
        img.loading = "lazy";
        poster.appendChild(img);
      } else {
        const ph = document.createElement("div");
        ph.className = "beta-placeholder";
        ph.textContent = initials(item.title);
        poster.appendChild(ph);
      }

      const badge = document.createElement("div");
      badge.className = "beta-badge";
      badge.textContent = label;
      poster.appendChild(badge);
      return poster;
    }

    function openInWizard(path) {
      try {
        const handoff = JSON.stringify({ src: path, preset: "auto", saved_at: Date.now() });
        sessionStorage.setItem("hbwiz_handoff", handoff);
        localStorage.setItem("hbwiz_last_handoff", handoff);
      } catch (e) {}
      window.location.assign("/size_wizard?src=" + encodeURIComponent(path) + "&preset=auto");
    }

    function makeMovieCard(item) {
      const card = document.createElement("article");
      card.className = "beta-card";
      if (itemIsSelected(item)) card.classList.add("beta-card-selected");
      card.appendChild(cardPoster(item, "Movie"));

      const body = document.createElement("div");
      body.className = "beta-card-body";
      addSelectLine(body, item, "Select movie");

      const title = document.createElement("div");
      title.className = "beta-card-title";
      title.textContent = `${item.title}${item.year ? ` (${item.year})` : ""}`;
      body.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "beta-card-meta";
      appendMetaLine(meta, `${fmtBytes(item.size_bytes)} source`);
      appendMetaLine(meta, `${item.is_hdr ? "HDR" : "SDR"} source`);
      appendMetaLine(meta, predictionText(item.prediction));
      appendMetaLine(meta, `${item.target?.label || "Movie"} target: ${item.target?.target_size_value || 5}${item.target?.target_size_unit || "GB"}`);
      appendMetaLine(meta, item.filename || "");
      body.appendChild(meta);

      const actions = document.createElement("div");
      actions.className = "beta-card-actions";
      const wizard = document.createElement("button");
      wizard.type = "button";
      wizard.textContent = "Wizard";
      wizard.onclick = () => openInWizard(item.path);
      actions.appendChild(wizard);
      const queue = document.createElement("button");
      queue.type = "button";
      queue.textContent = "Queue";
      queue.onclick = () => queuePaths([item.path], item.title || "movie");
      actions.appendChild(queue);
      body.appendChild(actions);

      card.appendChild(body);
      return card;
    }

    function makeShowCard(item) {
      const card = document.createElement("article");
      card.className = "beta-card";
      if (itemIsSelected(item)) card.classList.add("beta-card-selected");
      card.appendChild(cardPoster(item, "Show"));

      const body = document.createElement("div");
      body.className = "beta-card-body";
      addSelectLine(body, item, "Select episodes");

      const title = document.createElement("div");
      title.className = "beta-card-title";
      title.textContent = `${item.title}${item.year ? ` (${item.year})` : ""}`;
      body.appendChild(title);

      const seasonText = item.season_count === 1 ? "1 season" : `${item.season_count || 0} seasons`;
      const meta = document.createElement("div");
      meta.className = "beta-card-meta";
      appendMetaLine(meta, `${item.episode_count || 0} episodes / ${seasonText}`);
      appendMetaLine(meta, `${fmtBytes(item.total_size_bytes)} source total`);
      appendMetaLine(meta, `${item.is_hdr ? "HDR" : "SDR"} source`);
      appendMetaLine(meta, predictionText(item.prediction));
      appendMetaLine(meta, `Episode target: ${item.target?.target_size_value || 800}${item.target?.target_size_unit || "MB"}`);
      body.appendChild(meta);

      const first = Array.isArray(item.files) ? item.files[0] : null;
      const actions = document.createElement("div");
      actions.className = "beta-card-actions";
      if (first) {
        const wizard = document.createElement("button");
        wizard.type = "button";
        wizard.textContent = "First Episode";
        wizard.onclick = () => openInWizard(first.path);
        actions.appendChild(wizard);
      }
      const queue = document.createElement("button");
      queue.type = "button";
      queue.textContent = "Queue Show";
      queue.onclick = () => queuePaths(itemPaths(item), item.title || "show");
      actions.appendChild(queue);
      body.appendChild(actions);

      card.appendChild(body);
      return card;
    }

    function renderEmpty(grid, message) {
      const empty = document.createElement("div");
      empty.className = "beta-empty";
      empty.textContent = message;
      grid.appendChild(empty);
    }

    function renderLibrary() {
      const needle = el("searchInput").value.trim().toLowerCase();
      const movies = (libraryData.movies || []).filter((item) => includesFilter(item, needle));
      const shows = (libraryData.shows || []).filter((item) => includesFilter(item, needle));

      el("moviesGrid").innerHTML = "";
      el("showsGrid").innerHTML = "";
      movies.forEach((item) => el("moviesGrid").appendChild(makeMovieCard(item)));
      shows.forEach((item) => el("showsGrid").appendChild(makeShowCard(item)));

      if (!movies.length) renderEmpty(el("moviesGrid"), "No movies found.");
      if (!shows.length) renderEmpty(el("showsGrid"), "No shows found.");

      el("movieCount").textContent = `${movies.length} shown`;
      el("showCount").textContent = `${shows.length} shown`;
    }

    function renderStats(stats = {}) {
      el("statMovies").textContent = stats.movies || 0;
      el("statShows").textContent = stats.shows || 0;
      el("statEpisodes").textContent = stats.episodes || 0;
      el("statScanned").textContent = stats.scanned || 0;
    }

    function posterProblemText(data = {}) {
      const rows = [
        ...(Array.isArray(data.movies) ? data.movies : []),
        ...(Array.isArray(data.shows) ? data.shows : [])
      ];
      const errors = rows.filter((item) => item.source === "tmdb_error");
      if (!errors.length) return "";
      const first = errors.find((item) => item.error)?.error || "TMDb lookup failed";
      return ` Poster lookup had ${errors.length} error${errors.length === 1 ? "" : "s"}: ${first}`;
    }

    function renderTmdbNotice(data = {}) {
      const scannedAt = fmtDateTime(data.generated_at);
      const scanText = scannedAt ? ` Last scan: ${scannedAt}.` : " No saved scan yet.";
      const problemText = posterProblemText(data);
      if (data.tmdb_configured) {
        el("tmdbNotice").textContent = "This product uses the TMDb API but is not endorsed or certified by TMDb." + scanText + problemText;
      } else {
        el("tmdbNotice").textContent = "Poster lookup is off. Add TMDb credentials in Settings for live posters." + scanText;
      }
    }

    function applyCachedScope(data = {}) {
      if (data.scope === "all") {
        el("rootSelect").value = "__all__";
      } else if (data.root) {
        const option = Array.from(el("rootSelect").options).find((opt) => opt.value === data.root);
        if (option) el("rootSelect").value = data.root;
      }
    }

    async function loadCachedLibrary() {
      el("betaStatus").textContent = "Loading saved scan...";
      try {
        const res = await fetch("/api/beta/library_cache");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load saved scan");
        libraryData = data;
        selectedPaths.clear();
        applyCachedScope(data);
        renderStats(data.stats || {});
        renderTmdbNotice(data);
        renderLibrary();
        el("betaStatus").textContent = data.generated_at ? "Loaded saved scan." : "No saved scan yet.";
      } catch (e) {
        el("betaStatus").textContent = e.message || "Failed to load saved scan";
        libraryData = { movies: [], shows: [], stats: {} };
        renderStats({});
        renderLibrary();
      }
    }

    async function scanLibrary() {
      const root = el("rootSelect").value;
      const limit = Math.max(1, Math.min(2000, Number(el("limitInput").value || 800)));
      const params = new URLSearchParams({
        root,
        limit: String(limit),
        recursive: el("recursiveToggle").checked ? "1" : "0",
        posters: el("posterToggle").checked ? "1" : "0"
      });

      el("scanBtn").disabled = true;
      el("betaStatus").textContent = root === "__all__" ? "Scanning all libraries..." : "Scanning library...";

      try {
        const res = await fetch("/api/beta/library?" + params.toString());
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Scan failed");
        libraryData = data;
        selectedPaths.clear();
        renderStats(data.stats || {});
        renderTmdbNotice(data);
        renderLibrary();
        el("betaStatus").textContent = data.stats?.limited ? "Saved limited scan." : "Saved scan.";
      } catch (e) {
        el("betaStatus").textContent = e.message || "Scan failed";
        libraryData = { movies: [], shows: [], stats: {} };
        renderStats({});
        renderLibrary();
      } finally {
        el("scanBtn").disabled = false;
      }
    }

    function initRoots() {
      const select = el("rootSelect");
      select.innerHTML = "";
      const allOpt = document.createElement("option");
      allOpt.value = "__all__";
      allOpt.textContent = "All mapped folders";
      select.appendChild(allOpt);
      roots.forEach((root) => {
        const opt = document.createElement("option");
        opt.value = root.path;
        opt.textContent = root.label || root.path;
        select.appendChild(opt);
      });
    }

    function start() {
      initRoots();
      renderStats({});
      renderTmdbNotice({ tmdb_configured: tmdbConfigured });
      renderLibrary();
      el("scanBtn").addEventListener("click", scanLibrary);
      el("searchInput").addEventListener("input", renderLibrary);
      el("queueSelectedBtn").addEventListener("click", queueSelected);
      el("clearSelectedBtn").addEventListener("click", clearSelection);
      el("posterToggle").checked = true;
      updateSelectionUi();
      if (roots.length) {
        loadCachedLibrary();
      } else {
        el("scanBtn").disabled = true;
        el("betaStatus").textContent = "No Beta folders mapped. Use Settings > Map drives and folders.";
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start);
    } else {
      start();
    }
  </script>
</body>
