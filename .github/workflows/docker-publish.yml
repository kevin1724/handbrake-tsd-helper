name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kevina1724/handbrake-tsd-helper
  WORKER_IMAGE_NAME: kevina1724/handbrake-tsd-worker

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: kevina1724
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=HandBrake TSD Helper
            org.opencontainers.image.description=Web dashboard and queue manager for HandBrake transcoding

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: controller
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate worker image metadata
        id: worker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WORKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=ByteSqueeze Headless Worker
            org.opencontainers.image.description=Transfer-only HandBrake worker for a ByteSqueeze controller

      - name: Build and push headless worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          annotations: ${{ steps.worker-meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=worker
          provenance: mode=max
          sbom: true
